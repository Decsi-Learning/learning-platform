<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="auto" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="780" height="230" rx="16" fill="#f6fbf8" stroke="#cfe4da" stroke-width="1.5"/>

  <!-- Ponteiro head -->
  <rect x="30" y="95" width="70" height="40" rx="8" fill="#173b43"/>
  <text x="65" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">head</text>
  <line x1="100" y1="115" x2="140" y2="115" stroke="#789096" stroke-width="2.2"/>
  <polygon points="140,115 130,110 130,120" fill="#789096"/>

  <!-- Nó 1 -->
  <g>
    <rect x="145" y="85" width="70" height="50" fill="#147d78"/>
    <rect x="215" y="85" width="45" height="50" fill="#0d625f"/>
    <text x="180" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">10</text>
    <circle cx="237" cy="110" r="4" fill="#ffffff"/>
  </g>
  <line x1="245" y1="110" x2="310" y2="110" stroke="#789096" stroke-width="2.2"/>
  <polygon points="310,110 300,105 300,115" fill="#789096"/>

  <!-- Nó 2 -->
  <g>
    <rect x="315" y="85" width="70" height="50" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
    <rect x="385" y="85" width="45" height="50" fill="#dff1eb"/>
    <text x="350" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#173b43">25</text>
    <circle cx="407" cy="110" r="4" fill="#0d625f"/>
  </g>
  <line x1="415" y1="110" x2="480" y2="110" stroke="#789096" stroke-width="2.2"/>
  <polygon points="480,110 470,105 470,115" fill="#789096"/>

  <!-- Nó 3 -->
  <g>
    <rect x="485" y="85" width="70" height="50" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
    <rect x="555" y="85" width="45" height="50" fill="#dff1eb"/>
    <text x="520" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#173b43">7</text>
    <circle cx="577" cy="110" r="4" fill="#0d625f"/>
  </g>

  <!-- Retorno do último para o primeiro -->
  <path d="M 577 110 L 640 110 C 690 110, 690 190, 620 190 L 160 190 C 110 190, 100 160, 105 128" fill="none" stroke="#147d78" stroke-width="2.2"/>
  <polygon points="105,128 100,139 111,137" fill="#147d78"/>

  <text x="390" y="215" text-anchor="middle" font-size="12" fill="#42636a">O prox do &#250;ltimo n&#243; aponta de volta para o primeiro: n&#227;o h&#225; NULL, a lista forma um ciclo.</text>
</svg>
