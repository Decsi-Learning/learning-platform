  <!-- Nós -->
  <circle cx="210" cy="74" r="22" fill="#173b43"/>
  <text x="210" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">90</text>

  <circle cx="120" cy="148" r="21" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
  <text x="120" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">75</text>

  <circle cx="300" cy="148" r="21" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
  <text x="300" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">80</text>

  <circle cx="75" cy="226" r="20" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
