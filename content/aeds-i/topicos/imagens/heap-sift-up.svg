  <text x="345" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">95</text>

  <text x="210" y="284" text-anchor="middle" font-size="12" fill="#42636a">95 sobe até a raiz [0], empurrando 80 e 90 para baixo</text>
