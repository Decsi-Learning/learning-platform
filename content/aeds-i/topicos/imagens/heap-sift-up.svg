    <line x1="210" y1="74" x2="300" y2="148"/>
    <line x1="120" y1="148" x2="75" y2="226"/>
    <line x1="120" y1="148" x2="165" y2="226"/>
    <line x1="300" y1="148" x2="255" y2="226"/>
    <line x1="300" y1="148" x2="345" y2="226" stroke="#a44338" stroke-dasharray="4,3"/>
  </g>

  <!-- Setas de Troca (Sift-Up) -->
  <path d="M 358 205 Q 368 175 325 154" fill="none" stroke="#a44338" stroke-width="2.2"/>
  <polygon points="322,152 331,151 327,159" fill="#a44338"/>
  <text x="372" y="182" font-size="11" font-weight="700" fill="#a44338">1º</text>

