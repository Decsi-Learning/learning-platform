  <rect width="420" height="310" rx="16" fill="#f6fbf8" stroke="#cfe4da" stroke-width="1.5"/>
  <text x="210" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">Inserção de 95 (Operação Sift-Up)</text>

  <!-- Arestas -->
  <g stroke="#789096" stroke-width="2">
