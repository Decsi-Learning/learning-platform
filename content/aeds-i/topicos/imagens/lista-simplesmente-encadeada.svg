<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="100%" height="auto" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="780" height="170" rx="16" fill="#f6fbf8" stroke="#cfe4da" stroke-width="1.5"/>

  <!-- Ponteiro head -->
  <rect x="30" y="65" width="70" height="40" rx="8" fill="#173b43"/>
  <text x="65" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">head</text>
  <line x1="100" y1="85" x2="150" y2="85" stroke="#789096" stroke-width="2.2"/>
  <polygon points="150,85 140,80 140,90" fill="#789096"/>

  <!-- Nó 1 -->
  <g>
    <rect x="155" y="60" width="70" height="50" fill="#147d78"/>
    <rect x="225" y="60" width="45" height="50" fill="#0d625f"/>
    <text x="190" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">10</text>
    <circle cx="247" cy="85" r="4" fill="#ffffff"/>
    <text x="190" y="128" text-anchor="middle" font-size="11" fill="#42636a">info</text>
    <text x="247" y="128" text-anchor="middle" font-size="11" fill="#42636a">prox</text>
  </g>
  <line x1="255" y1="85" x2="320" y2="85" stroke="#789096" stroke-width="2.2"/>
  <polygon points="320,85 310,80 310,90" fill="#789096"/>

  <!-- Nó 2 -->
  <g>
    <rect x="325" y="60" width="70" height="50" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
    <rect x="395" y="60" width="45" height="50" fill="#dff1eb"/>
    <text x="360" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#173b43">25</text>
    <circle cx="417" cy="85" r="4" fill="#0d625f"/>
    <text x="360" y="128" text-anchor="middle" font-size="11" fill="#42636a">info</text>
    <text x="417" y="128" text-anchor="middle" font-size="11" fill="#42636a">prox</text>
  </g>
  <line x1="425" y1="85" x2="490" y2="85" stroke="#789096" stroke-width="2.2"/>
  <polygon points="490,85 480,80 480,90" fill="#789096"/>

  <!-- Nó 3 -->
  <g>
    <rect x="495" y="60" width="70" height="50" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
    <rect x="565" y="60" width="45" height="50" fill="#dff1eb"/>
    <text x="530" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#173b43">7</text>
    <circle cx="587" cy="85" r="4" fill="#0d625f"/>
    <text x="530" y="128" text-anchor="middle" font-size="11" fill="#42636a">info</text>
    <text x="587" y="128" text-anchor="middle" font-size="11" fill="#42636a">prox</text>
  </g>

  <!-- NULL -->
  <line x1="610" y1="85" x2="650" y2="85" stroke="#789096" stroke-width="2.2"/>
  <rect x="650" y="65" width="80" height="40" rx="8" fill="#ffffff" stroke="#cfe4da" stroke-width="1.5"/>
  <text x="690" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">NULL</text>
</svg>
