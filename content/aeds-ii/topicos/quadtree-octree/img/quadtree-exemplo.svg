<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">QuadTree com os pontos A, B, C, D e E num plano de 8 por 8</title>
  <desc id="d">À esquerda, o plano de 8 por 8 dividido em quatro quadrantes; o quadrante NO, que tem os pontos C e D, foi dividido de novo. À direita, a árvore: a raiz tem os filhos NO, NE, SO e SE. NO é um nó interno com as folhas C, D e duas folhas vazias; NE guarda B, SO guarda A e SE guarda E.</desc>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1e3a8a">QuadTree com os pontos A, B, C, D e E</text>
  <g stroke="#dfe1e2" stroke-width="1">
    <line x1="76" y1="64" x2="76" y2="352"/>
    <line x1="40" y1="100" x2="328" y2="100"/>
    <line x1="112" y1="64" x2="112" y2="352"/>
    <line x1="40" y1="136" x2="328" y2="136"/>
    <line x1="148" y1="64" x2="148" y2="352"/>
    <line x1="40" y1="172" x2="328" y2="172"/>
    <line x1="184" y1="64" x2="184" y2="352"/>
    <line x1="40" y1="208" x2="328" y2="208"/>
    <line x1="220" y1="64" x2="220" y2="352"/>
    <line x1="40" y1="244" x2="328" y2="244"/>
    <line x1="256" y1="64" x2="256" y2="352"/>
    <line x1="40" y1="280" x2="328" y2="280"/>
    <line x1="292" y1="64" x2="292" y2="352"/>
    <line x1="40" y1="316" x2="328" y2="316"/>
  </g>
  <rect x="40" y="64" width="288" height="288" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <!-- Divisões: raiz em x = 4 e y = 4; quadrante NO em x = 2 e y = 6 -->
  <g stroke="#2563eb" stroke-width="3">
    <line x1="184" y1="64" x2="184" y2="352"/>
    <line x1="40" y1="208" x2="328" y2="208"/>
  </g>
  <g stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4">
    <line x1="112" y1="64" x2="112" y2="208"/>
    <line x1="40" y1="136" x2="184" y2="136"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2563eb" opacity=".75">
    <text x="220" y="193.6">NE</text>
    <text x="47.2" y="341.2">SO</text>
    <text x="292" y="341.2">SE</text>
  </g>
  <g font-size="11" fill="#687178" text-anchor="middle">
    <text x="58" y="368">0</text>
    <text x="28" y="338">0</text>
    <text x="94" y="368">1</text>
    <text x="28" y="302">1</text>
    <text x="130" y="368">2</text>
    <text x="28" y="266">2</text>
    <text x="166" y="368">3</text>
    <text x="28" y="230">3</text>
    <text x="202" y="368">4</text>
    <text x="28" y="194">4</text>
    <text x="238" y="368">5</text>
    <text x="28" y="158">5</text>
    <text x="274" y="368">6</text>
    <text x="28" y="122">6</text>
    <text x="310" y="368">7</text>
    <text x="28" y="86">7</text>
    <text x="184" y="386" font-size="12">x</text>
    <text x="12" y="212" font-size="12">y</text>
  </g>
  <g>
    <circle cx="130" cy="298" r="9" fill="#9b123b"/>
    <text x="130" y="302" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="274" cy="118" r="9" fill="#9b123b"/>
    <text x="274" y="122" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
    <circle cx="94" cy="118" r="9" fill="#9b123b"/>
    <text x="94" y="122" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
    <circle cx="166" cy="82" r="9" fill="#9b123b"/>
    <text x="166" y="86" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
    <circle cx="238" cy="298" r="9" fill="#9b123b"/>
    <text x="238" y="302" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text>
  </g>
  <!-- Árvore -->
  <g stroke="#4e575d" stroke-width="2">
    <line x1="590" y1="112" x2="455" y2="180"/>
    <line x1="590" y1="112" x2="555" y2="180"/>
    <line x1="590" y1="112" x2="640" y2="180"/>
    <line x1="590" y1="112" x2="725" y2="180"/>
    <line x1="455" y1="212" x2="392" y2="284"/>
    <line x1="455" y1="212" x2="437" y2="284"/>
    <line x1="455" y1="212" x2="482" y2="284"/>
    <line x1="455" y1="212" x2="527" y2="284"/>
  </g>
  <g>
    <rect x="568" y="80" width="44" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="590" y="101" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">raiz</text>
    <text x="455" y="174" font-size="11" fill="#687178" text-anchor="middle">NO</text>
    <rect x="423" y="180" width="64" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="455" y="201" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4 filhos</text>
    <text x="555" y="174" font-size="11" fill="#687178" text-anchor="middle">NE</text>
    <rect x="537" y="180" width="36" height="32" rx="8" fill="#f5eaed" stroke="#9b123b" stroke-width="2.5"/>
    <text x="555" y="202" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#76102f" text-anchor="middle">B</text>
    <text x="640" y="174" font-size="11" fill="#687178" text-anchor="middle">SO</text>
    <rect x="622" y="180" width="36" height="32" rx="8" fill="#f5eaed" stroke="#9b123b" stroke-width="2.5"/>
    <text x="640" y="202" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#76102f" text-anchor="middle">A</text>
    <text x="725" y="174" font-size="11" fill="#687178" text-anchor="middle">SE</text>
    <rect x="707" y="180" width="36" height="32" rx="8" fill="#f5eaed" stroke="#9b123b" stroke-width="2.5"/>
    <text x="725" y="202" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#76102f" text-anchor="middle">E</text>
    <text x="392" y="278" font-size="11" fill="#687178" text-anchor="middle">NO</text>
    <rect x="374" y="284" width="36" height="32" rx="8" fill="#f5eaed" stroke="#9b123b" stroke-width="2.5"/>
    <text x="392" y="306" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#76102f" text-anchor="middle">C</text>
    <text x="437" y="278" font-size="11" fill="#687178" text-anchor="middle">NE</text>
    <rect x="419" y="284" width="36" height="32" rx="8" fill="#f5eaed" stroke="#9b123b" stroke-width="2.5"/>
    <text x="437" y="306" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#76102f" text-anchor="middle">D</text>
    <text x="482" y="278" font-size="11" fill="#687178" text-anchor="middle">SO</text>
    <rect x="464" y="284" width="36" height="32" rx="8" fill="#ffffff" stroke="#687178" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="482" y="305" font-size="12" fill="#687178" text-anchor="middle">—</text>
    <text x="527" y="278" font-size="11" fill="#687178" text-anchor="middle">SE</text>
    <rect x="509" y="284" width="36" height="32" rx="8" fill="#ffffff" stroke="#687178" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="527" y="305" font-size="12" fill="#687178" text-anchor="middle">—</text>
  </g>
  <g font-size="13" fill="#292d30">
    <rect x="390" y="372" width="26" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="424" y="387">nó dividido (tem 4 filhos)</text>
    <rect x="390" y="402" width="26" height="20" rx="6" fill="#f5eaed" stroke="#9b123b" stroke-width="2"/>
    <text x="424" y="417">folha com um ponto</text>
    <rect x="600" y="402" width="26" height="20" rx="6" fill="#ffffff" stroke="#687178" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="634" y="417">folha vazia</text>
    <text x="390" y="448" fill="#687178">Cada folha guarda no máximo um ponto.</text>
  </g>
</svg>
