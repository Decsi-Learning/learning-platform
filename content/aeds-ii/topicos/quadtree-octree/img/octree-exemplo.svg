<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Octree: um cubo dividido em 8 octantes</title>
  <desc id="d">À esquerda, um cubo dividido ao meio nas três direções, x, y e z, formando 8 cubos menores, os octantes; um deles está destacado. À direita, a árvore correspondente: a raiz representa o cubo inteiro e tem 8 filhos, um por octante.</desc>
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1e3a8a">Octree: cada nó dividido tem 8 filhos</text>
  <g>
    <polygon points="90.0,330.0 290.0,330.0 290.0,130.0 90.0,130.0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
    <polygon points="90.0,130.0 290.0,130.0 380.0,60.0 180.0,60.0" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
    <polygon points="290.0,330.0 380.0,260.0 380.0,60.0 290.0,130.0" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
  </g>
  <!-- Octante destacado -->
  <g>
    <polygon points="190.0,230.0 290.0,230.0 290.0,130.0 190.0,130.0" fill="#f5eaed" stroke="#9b123b" stroke-width="3"/>
    <polygon points="190.0,130.0 290.0,130.0 335.0,95.0 235.0,95.0" fill="#ead0d7" stroke="#9b123b" stroke-width="3"/>
    <polygon points="290.0,230.0 335.0,195.0 335.0,95.0 290.0,130.0" fill="#ead0d7" stroke="#9b123b" stroke-width="3"/>
  </g>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="190.0" y1="330.0" x2="190.0" y2="130.0"/>
    <line x1="90.0" y1="230.0" x2="290.0" y2="230.0"/>
    <line x1="135.0" y1="95.0" x2="335.0" y2="95.0"/>
    <line x1="190.0" y1="130.0" x2="280.0" y2="60.0"/>
    <line x1="335.0" y1="295.0" x2="335.0" y2="95.0"/>
    <line x1="290.0" y1="230.0" x2="380.0" y2="160.0"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#687178">
    <text x="186" y="354">x</text>
    <text x="68" y="234">y</text>
    <text x="345" y="313">z</text>
  </g>
  <text x="240" y="185" font-size="13" font-weight="bold" fill="#76102f" text-anchor="middle">1 octante</text>
  <!-- Árvore -->
  <g stroke="#4e575d" stroke-width="2">
    <line x1="590.0" y1="126.0" x2="440.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="483.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="526.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="569.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="612.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="655.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="698.0" y2="214.0"/>
    <line x1="590.0" y1="126.0" x2="741.0" y2="214.0"/>
  </g>
  <rect x="564" y="94" width="52" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="590" y="115" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">cubo</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="423" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="234" fill="#1e3a8a">1</text>
    <rect x="466" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="483" y="234" fill="#1e3a8a">2</text>
    <rect x="509" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="526" y="234" fill="#1e3a8a">3</text>
    <rect x="552" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="569" y="234" fill="#1e3a8a">4</text>
    <rect x="595" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="612" y="234" fill="#1e3a8a">5</text>
    <rect x="638" y="214" width="34" height="30" rx="7" fill="#f5eaed" stroke="#9b123b" stroke-width="3"/>
    <text x="655" y="234" fill="#76102f">6</text>
    <rect x="681" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="698" y="234" fill="#1e3a8a">7</text>
    <rect x="724" y="214" width="34" height="30" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="741" y="234" fill="#1e3a8a">8</text>
  </g>
  <g font-size="13" fill="#292d30">
    <text x="440" y="290">A raiz representa o cubo inteiro.</text>
    <text x="440" y="312">Dividir ao meio em x, y e z gera 2 × 2 × 2 = 8 octantes,</text>
    <text x="440" y="334">um filho para cada. O octante destacado é um deles.</text>
    <text x="440" y="366" fill="#687178">Na QuadTree, a mesma ideia em 2D dá 2 × 2 = 4 filhos.</text>
  </g>
</svg>
