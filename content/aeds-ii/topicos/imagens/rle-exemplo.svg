<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Codificação RLE de AAAABBBCCD</title>
  <desc id="d">A entrada AAAABBBCCD tem quatro corridas: quatro A, três B, dois C e um D. Cada corrida é substituída por um par contagem e símbolo, gerando 4A3B2C1D.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>

  <text x="60" y="34" font-size="15" font-weight="bold" fill="#1e293b">Entrada: AAAABBBCCD (10 símbolos)</text>

  <!-- Símbolos da entrada -->
  <g font-family="Courier New, monospace" font-size="24" font-weight="bold" text-anchor="middle">
    <rect x="60" y="50" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="88" y="80" fill="#1e3a8a">A</text>
    <rect x="120" y="50" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="148" y="80" fill="#1e3a8a">A</text>
    <rect x="180" y="50" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="208" y="80" fill="#1e3a8a">A</text>
    <rect x="240" y="50" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="268" y="80" fill="#1e3a8a">A</text>

    <rect x="300" y="50" width="56" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="328" y="80" fill="#14532d">B</text>
    <rect x="360" y="50" width="56" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="388" y="80" fill="#14532d">B</text>
    <rect x="420" y="50" width="56" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="448" y="80" fill="#14532d">B</text>

    <rect x="480" y="50" width="56" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="508" y="80" fill="#78350f">C</text>
    <rect x="540" y="50" width="56" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="568" y="80" fill="#78350f">C</text>

    <rect x="600" y="50" width="56" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="628" y="80" fill="#4c1d95">D</text>
  </g>

  <!-- Chaves das corridas -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <path d="M60,102 v8 H296 v-8"/>
    <path d="M300,102 v8 H476 v-8"/>
    <path d="M480,102 v8 H596 v-8"/>
    <path d="M600,102 v8 H656 v-8"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1e293b">
    <text x="178" y="130">corrida de 4 × A</text>
    <text x="388" y="130">corrida de 3 × B</text>
    <text x="538" y="130">2 × C</text>
    <text x="628" y="130">1 × D</text>
  </g>

  <!-- Seta -->
  <line x1="360" y1="145" x2="360" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <text x="374" y="170" font-size="14" fill="#475569">RLE: cada corrida vira (contagem, símbolo)</text>

  <!-- Pares de saída -->
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="130" y="195" width="100" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="224" fill="#1e3a8a">(4, A)</text>
    <rect x="250" y="195" width="100" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="224" fill="#14532d">(3, B)</text>
    <rect x="370" y="195" width="100" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="420" y="224" fill="#78350f">(2, C)</text>
    <rect x="490" y="195" width="100" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="540" y="224" fill="#4c1d95">(1, D)</text>
  </g>

  <text x="360" y="276" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b">Saída: 4A3B2C1D — 8 símbolos em vez de 10 (taxa 8/10 = 0,8)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
