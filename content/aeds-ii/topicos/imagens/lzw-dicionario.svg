<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Codificação LZW de ABABABA</title>
  <desc id="d">Tabela com os passos da codificação LZW da entrada ABABABA. O dicionário aprende AB como 256, BA como 257 e ABA como 258. A saída é 65, 66, 256 e 258.</desc>
  <rect width="760" height="410" fill="#ffffff"/>

  <text x="30" y="26" font-size="17" font-weight="bold" fill="#1e293b">Codificação LZW de ABABABA</text>
  <text x="30" y="46" font-size="13" fill="#475569">Dicionário inicial com os bytes 0 a 255 (A = 65, B = 66). Começamos com w = A.</text>

  <!-- Cabeçalho -->
  <rect x="30" y="58" width="700" height="34" fill="#1e293b"/>
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="60" y="80">Passo</text>
    <text x="135" y="80">Lê c</text>
    <text x="225" y="80">w + c</text>
    <text x="330" y="80">No dicionário?</text>
    <text x="430" y="80">Emite</text>
    <text x="545" y="80">Nova entrada</text>
    <text x="675" y="80">Novo w</text>
  </g>

  <!-- Linhas -->
  <g stroke="#cbd5e1" stroke-width="1">
    <rect x="30" y="92" width="700" height="34" fill="#fef9c3"/>
    <rect x="30" y="126" width="700" height="34" fill="#fef9c3"/>
    <rect x="30" y="160" width="700" height="34" fill="#f1f5f9"/>
    <rect x="30" y="194" width="700" height="34" fill="#fef9c3"/>
    <rect x="30" y="228" width="700" height="34" fill="#f1f5f9"/>
    <rect x="30" y="262" width="700" height="34" fill="#f1f5f9"/>
    <rect x="30" y="296" width="700" height="34" fill="#dcfce7"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="90" y1="58" x2="90" y2="330"/>
    <line x1="180" y1="58" x2="180" y2="330"/>
    <line x1="270" y1="58" x2="270" y2="330"/>
    <line x1="390" y1="58" x2="390" y2="330"/>
    <line x1="470" y1="58" x2="470" y2="330"/>
    <line x1="620" y1="58" x2="620" y2="330"/>
  </g>

  <g font-family="Courier New, monospace" font-size="15" text-anchor="middle" fill="#0f172a">
    <!-- passo 1 -->
    <text x="60" y="114">1</text><text x="135" y="114">B</text><text x="225" y="114">AB</text><text x="330" y="114">não</text>
    <text x="430" y="114" font-weight="bold">65</text><text x="545" y="114">AB = 256</text><text x="675" y="114">B</text>
    <!-- passo 2 -->
    <text x="60" y="148">2</text><text x="135" y="148">A</text><text x="225" y="148">BA</text><text x="330" y="148">não</text>
    <text x="430" y="148" font-weight="bold">66</text><text x="545" y="148">BA = 257</text><text x="675" y="148">A</text>
    <!-- passo 3 -->
    <text x="60" y="182">3</text><text x="135" y="182">B</text><text x="225" y="182">AB</text><text x="330" y="182">sim (256)</text>
    <text x="430" y="182">—</text><text x="545" y="182">—</text><text x="675" y="182">AB</text>
    <!-- passo 4 -->
    <text x="60" y="216">4</text><text x="135" y="216">A</text><text x="225" y="216">ABA</text><text x="330" y="216">não</text>
    <text x="430" y="216" font-weight="bold">256</text><text x="545" y="216">ABA = 258</text><text x="675" y="216">A</text>
    <!-- passo 5 -->
    <text x="60" y="250">5</text><text x="135" y="250">B</text><text x="225" y="250">AB</text><text x="330" y="250">sim (256)</text>
    <text x="430" y="250">—</text><text x="545" y="250">—</text><text x="675" y="250">AB</text>
    <!-- passo 6 -->
    <text x="60" y="284">6</text><text x="135" y="284">A</text><text x="225" y="284">ABA</text><text x="330" y="284">sim (258)</text>
    <text x="430" y="284">—</text><text x="545" y="284">—</text><text x="675" y="284">ABA</text>
    <!-- fim -->
    <text x="60" y="318">Fim</text><text x="135" y="318">—</text><text x="225" y="318">—</text><text x="330" y="318">—</text>
    <text x="430" y="318" font-weight="bold">258</text><text x="545" y="318">—</text><text x="675" y="318">—</text>
  </g>

  <text x="380" y="362" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Saída: 65 66 256 258</text>
  <text x="380" y="386" font-size="13" text-anchor="middle" fill="#475569">7 símbolos viraram 4 códigos. Linhas amarelas: emitem um código e criam uma entrada nova.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
