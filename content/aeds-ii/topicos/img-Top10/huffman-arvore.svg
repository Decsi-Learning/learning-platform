<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Árvore de Huffman para ABRACADABRA</title>
  <desc id="d">A raiz de frequência 11 tem à esquerda a folha A de frequência 5 e à direita um nó de frequência 6. Esse nó tem à esquerda o nó de frequência 2, pai de C e D, e à direita o nó de frequência 4, pai de B e R. Os códigos são A igual a 0, C igual a 100, D igual a 101, B igual a 110 e R igual a 111.</desc>
  <rect width="760" height="460" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1e293b">Árvore de Huffman: ABRACADABRA (esquerda = 0, direita = 1)</text>

  <!-- Arestas -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="380" y1="70" x2="200" y2="160"/>
    <line x1="380" y1="70" x2="480" y2="160"/>
    <line x1="480" y1="160" x2="380" y2="250"/>
    <line x1="480" y1="160" x2="580" y2="250"/>
    <line x1="380" y1="250" x2="320" y2="340"/>
    <line x1="380" y1="250" x2="440" y2="340"/>
    <line x1="580" y1="250" x2="520" y2="340"/>
    <line x1="580" y1="250" x2="640" y2="340"/>
  </g>

  <!-- Rótulos das arestas -->
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="5" paint-order="stroke">
    <text x="290" y="121">0</text>
    <text x="430" y="121">1</text>
    <text x="430" y="211">0</text>
    <text x="530" y="211">1</text>
    <text x="350" y="301">0</text>
    <text x="410" y="301">1</text>
    <text x="550" y="301">0</text>
    <text x="610" y="301">1</text>
  </g>

  <!-- Nós internos -->
  <g fill="#e2e8f0" stroke="#475569" stroke-width="2.5">
    <circle cx="380" cy="70" r="26"/>
    <circle cx="480" cy="160" r="26"/>
    <circle cx="380" cy="250" r="26"/>
    <circle cx="580" cy="250" r="26"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <text x="380" y="76">11</text>
    <text x="480" y="166">6</text>
    <text x="380" y="256">2</text>
    <text x="580" y="256">4</text>
  </g>

  <!-- Folhas -->
  <g stroke-width="2.5">
    <circle cx="200" cy="160" r="28" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="320" cy="340" r="28" fill="#fef3c7" stroke="#d97706"/>
    <circle cx="440" cy="340" r="28" fill="#ede9fe" stroke="#7c3aed"/>
    <circle cx="520" cy="340" r="28" fill="#dcfce7" stroke="#16a34a"/>
    <circle cx="640" cy="340" r="28" fill="#fce7f3" stroke="#db2777"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="200" y="158" font-size="22" fill="#1e3a8a">A</text>
    <text x="200" y="176" font-size="12" fill="#1e3a8a">f=5</text>
    <text x="320" y="338" font-size="22" fill="#78350f">C</text>
    <text x="320" y="356" font-size="12" fill="#78350f">f=1</text>
    <text x="440" y="338" font-size="22" fill="#4c1d95">D</text>
    <text x="440" y="356" font-size="12" fill="#4c1d95">f=1</text>
    <text x="520" y="338" font-size="22" fill="#14532d">B</text>
    <text x="520" y="356" font-size="12" fill="#14532d">f=2</text>
    <text x="640" y="338" font-size="22" fill="#831843">R</text>
    <text x="640" y="356" font-size="12" fill="#831843">f=2</text>
  </g>

  <!-- Códigos das folhas -->
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <text x="200" y="208">0</text>
    <text x="320" y="388">100</text>
    <text x="440" y="388">101</text>
    <text x="520" y="388">110</text>
    <text x="640" y="388">111</text>
  </g>

  <!-- Resumo -->
  <g font-family="Courier New, monospace" font-size="15" fill="#1e293b">
    <text x="20" y="424">Códigos: A=0  C=100  D=101  B=110  R=111</text>
    <text x="20" y="446">ABRACADABRA → 0 110 111 0 100 0 101 0 110 111 0  (23 bits)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
