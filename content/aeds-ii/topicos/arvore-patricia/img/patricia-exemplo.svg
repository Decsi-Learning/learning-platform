<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Árvore Patricia com as chaves B, C, H, J, Q e W</title>
  <desc id="d">Cada chave tem 5 bits. A raiz testa o bit 1. À esquerda, um nó testa o bit 2: seu filho esquerdo testa o bit 5 e separa B (00010) de C (00011); seu filho direito testa o bit 4 e separa H (01000) de J (01010). À direita da raiz, um nó testa o bit 3 e separa Q (10001) de W (10111). Os bits 3 e 4 são pulados no caminho até B e C, e o bit 2 é pulado no caminho até Q e W.</desc>
  <rect width="760" height="500" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1e3a8a">Árvore Patricia com as chaves B, C, H, J, Q e W (5 bits cada)</text>

  <!-- Arestas -->
  <g stroke="#4e575d" stroke-width="2.5" fill="none">
    <line x1="380" y1="85" x2="220" y2="185"/>
    <line x1="380" y1="85" x2="580" y2="185"/>
    <line x1="220" y1="185" x2="130" y2="290"/>
    <line x1="220" y1="185" x2="320" y2="290"/>
    <line x1="130" y1="290" x2="80" y2="385"/>
    <line x1="130" y1="290" x2="185" y2="385"/>
    <line x1="320" y1="290" x2="270" y2="385"/>
    <line x1="320" y1="290" x2="375" y2="385"/>
    <line x1="580" y1="185" x2="525" y2="285"/>
    <line x1="580" y1="185" x2="640" y2="285"/>
  </g>

  <!-- Bits nas arestas -->
  <g font-family="Courier New, monospace" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a8a" stroke="#ffffff" stroke-width="5" paint-order="stroke">
    <text x="290" y="128">0</text>
    <text x="490" y="128">1</text>
    <text x="164" y="235">0</text>
    <text x="282" y="235">1</text>
    <text x="94" y="340">0</text>
    <text x="168" y="340">1</text>
    <text x="284" y="340">0</text>
    <text x="360" y="340">1</text>
    <text x="540" y="235">0</text>
    <text x="622" y="235">1</text>
  </g>

  <!-- Bits pulados -->
  <g font-size="12" font-weight="bold" fill="#1e3a8a">
    <text x="18" y="232">pula os bits 3 e 4</text>
    <text x="604" y="135">pula o bit 2</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="110" y1="236" x2="150" y2="248"/>
    <line x1="600" y1="138" x2="545" y2="150"/>
  </g>

  <!-- Nós internos: índice do bit testado -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2.5">
    <circle cx="380" cy="85" r="26"/>
    <circle cx="220" cy="185" r="24"/>
    <circle cx="580" cy="185" r="24"/>
    <circle cx="130" cy="290" r="24"/>
    <circle cx="320" cy="290" r="24"/>
  </g>
  <g text-anchor="middle" fill="#1e3a8a">
    <text x="380" y="80" font-size="10">bit</text>
    <text x="380" y="98" font-size="19" font-weight="bold">1</text>
    <text x="220" y="180" font-size="10">bit</text>
    <text x="220" y="197" font-size="18" font-weight="bold">2</text>
    <text x="580" y="180" font-size="10">bit</text>
    <text x="580" y="197" font-size="18" font-weight="bold">3</text>
    <text x="130" y="285" font-size="10">bit</text>
    <text x="130" y="302" font-size="18" font-weight="bold">5</text>
    <text x="320" y="285" font-size="10">bit</text>
    <text x="320" y="302" font-size="18" font-weight="bold">4</text>
  </g>

  <!-- Folhas: chaves -->
  <g fill="#f5eaed" stroke="#9b123b" stroke-width="2.5">
    <rect x="50" y="385" width="60" height="52" rx="10"/>
    <rect x="155" y="385" width="60" height="52" rx="10"/>
    <rect x="240" y="385" width="60" height="52" rx="10"/>
    <rect x="345" y="385" width="60" height="52" rx="10"/>
    <rect x="495" y="285" width="60" height="52" rx="10"/>
    <rect x="610" y="285" width="60" height="52" rx="10"/>
  </g>
  <g text-anchor="middle" font-weight="bold" fill="#76102f">
    <text x="80" y="410" font-size="20">B</text>
    <text x="185" y="410" font-size="20">C</text>
    <text x="270" y="410" font-size="20">H</text>
    <text x="375" y="410" font-size="20">J</text>
    <text x="525" y="310" font-size="20">Q</text>
    <text x="640" y="310" font-size="20">W</text>
  </g>
  <g text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#9b123b">
    <text x="80" y="429">00010</text>
    <text x="185" y="429">00011</text>
    <text x="270" y="429">01000</text>
    <text x="375" y="429">01010</text>
    <text x="525" y="329">10001</text>
    <text x="640" y="329">10111</text>
  </g>

  <!-- Legenda -->
  <g font-size="13" fill="#292d30">
    <circle cx="470" cy="400" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="490" y="405">nó interno: qual bit testar</text>
    <rect x="459" y="428" width="22" height="18" rx="5" fill="#f5eaed" stroke="#9b123b" stroke-width="2"/>
    <text x="490" y="442">folha: guarda a chave inteira</text>
    <text x="459" y="474" font-size="12" fill="#687178">bit 0 → esquerda · bit 1 → direita</text>
  </g>
</svg>
