<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Saltos sublineares no Boyer-Moore-Horspool (BMH)</title>
  <desc id="d">Diagrama do BMH procurando ABRA em CABDACABRA. Comparando da direita para a esquerda, a janela s=0 falha em D e salta 4 posições direto para s=4, ignorando caracteres intermediários. Em s=4 falha em B e salta 2 para s=6, onde encontra ABRA com apenas 3 janelas e 6 comparações.</desc>
  <defs>
    <marker id="seta-roxa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="seta-esq" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="760" height="375" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1e293b">BMH: comparação da direita para a esquerda e saltos na tabela d</text>

  <!-- Caixa da tabela d -->
  <rect x="24" y="44" width="712" height="38" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="40" y="68" font-size="13.5" font-weight="bold" fill="#5b21b6">Tabela d para P = ABRA (olhando ABR):</text>
  <g font-family="Courier New, monospace" font-size="14" font-weight="bold">
    <text x="336" y="68" fill="#1e3a8a">d[A] = 3</text>
    <text x="434" y="68" fill="#1e3a8a">d[B] = 2</text>
    <text x="532" y="68" fill="#1e3a8a">d[R] = 1</text>
    <text x="630" y="68" fill="#7c3aed">outros = 4</text>
  </g>

  <!-- Índices e Texto CABDACABRA -->
  <g font-family="Courier New, monospace" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="155" y="106">0</text><text x="210" y="106">1</text><text x="265" y="106">2</text>
    <text x="320" y="106">3</text><text x="375" y="106">4</text><text x="430" y="106">5</text>
    <text x="485" y="106">6</text><text x="540" y="106">7</text><text x="595" y="106">8</text>
    <text x="650" y="106">9</text>
  </g>
  <text x="24" y="140" font-size="14" font-weight="bold" fill="#1e293b">Texto T:</text>
  <g font-family="Courier New, monospace" font-size="22" font-weight="bold" text-anchor="middle">
    <!-- 0..2 pulados -->
    <rect x="132" y="114" width="46" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="155" y="140" fill="#94a3b8">C</text>
    <rect x="187" y="114" width="46" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="210" y="140" fill="#94a3b8">A</text>
    <rect x="242" y="114" width="46" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="265" y="140" fill="#94a3b8">B</text>
    <!-- 3 D (falha) -->
    <rect x="297" y="114" width="46" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="320" y="140" fill="#991b1b">D</text>
    <!-- 4..5 pulados -->
    <rect x="352" y="114" width="46" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="375" y="140" fill="#94a3b8">A</text>
    <rect x="407" y="114" width="46" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="430" y="140" fill="#94a3b8">C</text>
    <!-- 6..9 ocorrência ABRA -->
    <rect x="462" y="114" width="46" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="485" y="140" fill="#14532d">A</text>
    <rect x="517" y="114" width="46" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="540" y="140" fill="#14532d">B</text>
    <rect x="572" y="114" width="46" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="595" y="140" fill="#14532d">R</text>
    <rect x="627" y="114" width="46" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="650" y="140" fill="#14532d">A</text>
  </g>

  <!-- Tentativa 1: s = 0 -->
  <text x="24" y="200" font-size="13" font-weight="bold" fill="#b91c1c">1) s = 0:</text>
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="134" y="176" width="42" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="155" y="200" fill="#94a3b8">A</text>
    <rect x="189" y="176" width="42" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="210" y="200" fill="#94a3b8">B</text>
    <rect x="244" y="176" width="42" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="265" y="200" fill="#94a3b8">R</text>
    <rect x="299" y="176" width="42" height="34" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="320" y="200" fill="#991b1b">A</text>
  </g>
  <path d="M348,193 Q452,188 452,226" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#seta-roxa)"/>
  <text x="415" y="182" font-size="12.5" font-weight="bold" fill="#6d28d9">D não está em P → salta d[D] = 4!</text>

  <!-- Tentativa 2: s = 4 -->
  <text x="24" y="260" font-size="13" font-weight="bold" fill="#b91c1c">2) s = 4:</text>
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="354" y="236" width="42" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="375" y="260" fill="#94a3b8">A</text>
    <rect x="409" y="236" width="42" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="430" y="260" fill="#94a3b8">B</text>
    <rect x="464" y="236" width="42" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="485" y="260" fill="#94a3b8">R</text>
    <rect x="519" y="236" width="42" height="34" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="540" y="260" fill="#991b1b">A</text>
  </g>
  <path d="M566,253 Q610,255 610,286" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#seta-roxa)"/>
  <text x="582" y="246" font-size="12.5" font-weight="bold" fill="#6d28d9">T[7] = B → d[B] = 2</text>

  <!-- Tentativa 3: s = 6 (casou!) -->
  <text x="24" y="318" font-size="13" font-weight="bold" fill="#15803d">3) s = 6:</text>
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="464" y="294" width="42" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="485" y="318" fill="#14532d">A</text>
    <rect x="519" y="294" width="42" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="540" y="318" fill="#14532d">B</text>
    <rect x="574" y="294" width="42" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="595" y="318" fill="#14532d">R</text>
    <rect x="629" y="294" width="42" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="650" y="318" fill="#14532d">A</text>
  </g>
  <line x1="658" y1="338" x2="476" y2="338" stroke="#0f766e" stroke-width="2" marker-end="url(#seta-esq)"/>
  <text x="568" y="355" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f766e">compara da direita para a esquerda</text>

  <rect x="132" y="294" width="312" height="36" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="288" y="317" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">5 caracteres do texto nem foram lidos!</text>
</svg>
