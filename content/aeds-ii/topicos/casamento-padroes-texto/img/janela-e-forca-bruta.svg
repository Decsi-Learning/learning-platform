<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Anatomia do casamento de padrões e busca por força bruta</title>
  <desc id="d">Diagrama mostrando o texto ABRACADABRA de tamanho 11 e o padrão ABRA de tamanho 4 testado nas janelas s=0 (ocorrência), s=3 (falha no segundo caractere, avançando apenas 1 posição) e s=7 (segunda ocorrência).</desc>
  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="355" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1e293b">Anatomia da busca: Texto T (n = 11), Padrão P = ABRA (m = 4) e janelas</text>

  <!-- Índices do texto -->
  <g font-family="Courier New, monospace" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="155" y="58">0</text><text x="205" y="58">1</text><text x="255" y="58">2</text>
    <text x="305" y="58">3</text><text x="355" y="58">4</text><text x="405" y="58">5</text>
    <text x="455" y="58">6</text><text x="505" y="58">7</text><text x="555" y="58">8</text>
    <text x="605" y="58">9</text><text x="655" y="58">10</text>
  </g>

  <!-- Rótulo Texto -->
  <text x="24" y="92" font-size="14" font-weight="bold" fill="#1e293b">Texto T:</text>

  <!-- Células do Texto ABRACADABRA -->
  <g font-family="Courier New, monospace" font-size="22" font-weight="bold" text-anchor="middle">
    <!-- 0..3 ocorrência -->
    <rect x="132" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="155" y="94" fill="#14532d">A</text>
    <rect x="182" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="205" y="94" fill="#14532d">B</text>
    <rect x="232" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="255" y="94" fill="#14532d">R</text>
    <rect x="282" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="305" y="94" fill="#14532d">A</text>
    <!-- 4..6 meio -->
    <rect x="332" y="66" width="46" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="355" y="94" fill="#334155">C</text>
    <rect x="382" y="66" width="46" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="405" y="94" fill="#334155">A</text>
    <rect x="432" y="66" width="46" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="455" y="94" fill="#334155">D</text>
    <!-- 7..10 ocorrência -->
    <rect x="482" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="505" y="94" fill="#14532d">A</text>
    <rect x="532" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="555" y="94" fill="#14532d">B</text>
    <rect x="582" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="605" y="94" fill="#14532d">R</text>
    <rect x="632" y="66" width="46" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="655" y="94" fill="#14532d">A</text>
  </g>

  <!-- Janela s = 0 -->
  <text x="24" y="156" font-size="13" font-weight="bold" fill="#15803d">Janela s = 0</text>
  <rect x="128" y="128" width="204" height="46" rx="8" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="134" y="133" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="155" y="158" fill="#14532d">A</text>
    <rect x="184" y="133" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="205" y="158" fill="#14532d">B</text>
    <rect x="234" y="133" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="255" y="158" fill="#14532d">R</text>
    <rect x="284" y="133" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="305" y="158" fill="#14532d">A</text>
  </g>
  <text x="346" y="156" font-size="13" font-weight="bold" fill="#15803d">4 iguais → Ocorrência em s = 0</text>

  <!-- Janela s = 3 (falha) -->
  <text x="24" y="220" font-size="13" font-weight="bold" fill="#b91c1c">Janela s = 3</text>
  <rect x="278" y="192" width="204" height="46" rx="8" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="284" y="197" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="305" y="222" fill="#14532d">A</text>
    <rect x="334" y="197" width="42" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="355" y="222" fill="#991b1b">B</text>
    <rect x="384" y="197" width="42" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="405" y="222" fill="#94a3b8">R</text>
    <rect x="434" y="197" width="42" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="455" y="222" fill="#94a3b8">A</text>
  </g>
  <text x="496" y="212" font-size="13" font-weight="bold" fill="#b91c1c">T[4] = C ≠ P[1] = B</text>
  <text x="496" y="230" font-size="12" fill="#475569">Descarta a janela e avança só +1</text>

  <!-- Janela s = 7 (2ª ocorrência) -->
  <text x="24" y="284" font-size="13" font-weight="bold" fill="#15803d">Janela s = 7</text>
  <rect x="478" y="256" width="204" height="46" rx="8" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="484" y="261" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="505" y="286" fill="#14532d">A</text>
    <rect x="534" y="261" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="555" y="286" fill="#14532d">B</text>
    <rect x="584" y="261" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="605" y="286" fill="#14532d">R</text>
    <rect x="634" y="261" width="42" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="655" y="286" fill="#14532d">A</text>
  </g>
  <text x="466" y="276" font-size="12.5" text-anchor="end" fill="#475569">Última janela possível (s = n − m = 7)</text>
  <text x="466" y="295" font-size="13" font-weight="bold" text-anchor="end" fill="#15803d">4 iguais → 2ª ocorrência em s = 7</text>

  <!-- Rodapé / Legenda -->
  <g font-size="12.5" fill="#334155">
    <rect x="24" y="324" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="45" y="336">caractere igual</text>
    <rect x="165" y="324" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="186" y="336">primeira diferença (para a janela)</text>
    <rect x="405" y="324" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="426" y="336">não comparado</text>
  </g>
</svg>
