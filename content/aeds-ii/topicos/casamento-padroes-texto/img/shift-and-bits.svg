<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Operação bit a bit do algoritmo Shift-And para o padrão ABRA</title>
  <desc id="d">À esquerda, a tabela de máscaras M[c] para P = ABRA (M[A]=1001, M[B]=0010, M[R]=0100, outros=0000). À direita, o passo i=5 (T[5]=A): R antes=0100 é deslocado à esquerda com bit 0 ligado virando 1001, faz AND com M[A]=1001 e produz R novo=1001, ligando o bit 3 que sinaliza a ocorrência na posição 2.</desc>
  <defs>
    <marker id="seta-bit" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="760" height="365" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1e293b">Shift-And: paralelismo de bits na detecção de P = ABRA (m = 4)</text>

  <!-- Card esquerdo: Tabela de Máscaras -->
  <rect x="24" y="48" width="286" height="296" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="76" font-size="14" font-weight="bold" fill="#1e293b">1. Máscaras M[c] (bits 3..0)</text>
  <text x="42" y="96" font-size="12" fill="#64748b">Bit j = 1 onde P[j] = c  (bit 0 à direita)</text>

  <!-- Cabeçalho bits -->
  <g font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">
    <text x="150" y="122">3(A)</text><text x="188" y="122">2(R)</text><text x="226" y="122">1(B)</text><text x="264" y="122">0(A)</text>
  </g>

  <!-- M[A] = 1001 -->
  <text x="44" y="156" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#1e293b">M[A]</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="134" y="134" width="32" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="156" fill="#1e3a8a">1</text>
    <rect x="172" y="134" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="188" y="156" fill="#94a3b8">0</text>
    <rect x="210" y="134" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="226" y="156" fill="#94a3b8">0</text>
    <rect x="248" y="134" width="32" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="264" y="156" fill="#1e3a8a">1</text>
  </g>

  <!-- M[B] = 0010 -->
  <text x="44" y="200" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#1e293b">M[B]</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="134" y="178" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="150" y="200" fill="#94a3b8">0</text>
    <rect x="172" y="178" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="188" y="200" fill="#94a3b8">0</text>
    <rect x="210" y="178" width="32" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="226" y="200" fill="#1e3a8a">1</text>
    <rect x="248" y="178" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="264" y="200" fill="#94a3b8">0</text>
  </g>

  <!-- M[R] = 0100 -->
  <text x="44" y="244" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#1e293b">M[R]</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="134" y="222" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="150" y="244" fill="#94a3b8">0</text>
    <rect x="172" y="222" width="32" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="188" y="244" fill="#1e3a8a">1</text>
    <rect x="210" y="222" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="226" y="244" fill="#94a3b8">0</text>
    <rect x="248" y="222" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="264" y="244" fill="#94a3b8">0</text>
  </g>

  <!-- outros = 0000 -->
  <text x="44" y="288" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#64748b">outros</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="134" y="266" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="150" y="288" fill="#94a3b8">0</text>
    <rect x="172" y="266" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="188" y="288" fill="#94a3b8">0</text>
    <rect x="210" y="266" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="226" y="288" fill="#94a3b8">0</text>
    <rect x="248" y="266" width="32" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="264" y="288" fill="#94a3b8">0</text>
  </g>
  <text x="42" y="328" font-size="12" fill="#475569">Bit alvo = 1000 (bit m − 1 = 3)</text>

  <!-- Card direito: Passo i = 5 -->
  <rect x="330" y="48" width="406" height="296" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="348" y="76" font-size="14" font-weight="bold" fill="#1e293b">2. Atualização ao ler T[5] = 'A' (após "ABR")</text>

  <!-- R antes -->
  <text x="348" y="122" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#334155">R antes</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="466" y="100" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="484" y="122" fill="#94a3b8">0</text>
    <rect x="510" y="100" width="36" height="32" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="528" y="122" fill="#78350f">1</text>
    <rect x="554" y="100" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="572" y="122" fill="#94a3b8">0</text>
    <rect x="598" y="100" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="616" y="122" fill="#94a3b8">0</text>
  </g>
  <text x="646" y="121" font-size="12" fill="#b45309">"ABR" ativo</text>

  <!-- Setas diagonais de shift << 1 -->
  <line x1="524" y1="134" x2="490" y2="162" stroke="#2563eb" stroke-width="2" marker-end="url(#seta-bit)"/>
  <line x1="568" y1="134" x2="534" y2="162" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="612" y1="134" x2="578" y2="162" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="644" y="156" font-size="12" font-weight="bold" fill="#2563eb">&lt;&lt; 1 e | 1</text>

  <!-- (R << 1) | 1 -->
  <text x="348" y="188" font-family="Courier New, monospace" font-size="13.5" font-weight="bold" fill="#1d4ed8">(R&lt;&lt;1)|1</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="466" y="166" width="36" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="484" y="188" fill="#1e3a8a">1</text>
    <rect x="510" y="166" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="528" y="188" fill="#94a3b8">0</text>
    <rect x="554" y="166" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="572" y="188" fill="#94a3b8">0</text>
    <rect x="598" y="166" width="36" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="616" y="188" fill="#1e3a8a">1</text>
  </g>
  <text x="644" y="187" font-size="12" fill="#475569">bit 0 = 1</text>

  <!-- & M[A] -->
  <text x="348" y="236" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#7c3aed">&amp; M['A']</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="466" y="214" width="36" height="32" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="484" y="236" fill="#4c1d95">1</text>
    <rect x="510" y="214" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="528" y="236" fill="#94a3b8">0</text>
    <rect x="554" y="214" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="572" y="236" fill="#94a3b8">0</text>
    <rect x="598" y="214" width="36" height="32" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="616" y="236" fill="#4c1d95">1</text>
  </g>
  <text x="644" y="235" font-size="12" fill="#6d28d9">filtra 'A'</text>

  <!-- Linha divisória do AND -->
  <line x1="464" y1="258" x2="636" y2="258" stroke="#334155" stroke-width="2"/>

  <!-- R novo -->
  <text x="348" y="292" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#15803d">R novo</text>
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="466" y="270" width="36" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="484" y="292" fill="#14532d">1</text>
    <rect x="510" y="270" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="528" y="292" fill="#94a3b8">0</text>
    <rect x="554" y="270" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="572" y="292" fill="#94a3b8">0</text>
    <rect x="598" y="270" width="36" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="616" y="292" fill="#14532d">1</text>
  </g>
  <text x="644" y="285" font-size="12" font-weight="bold" fill="#15803d">bit 3 = 1!</text>
  <text x="644" y="301" font-size="11.5" fill="#15803d">Ocorrência</text>

  <rect x="348" y="312" width="370" height="22" rx="6" fill="#dcfce7"/>
  <text x="533" y="327" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d">R &amp; alvo ≠ 0 → "ABRA" encontrado em 5 − 4 + 1 = 2</text>
</svg>
