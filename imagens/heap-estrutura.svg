<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="auto" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="780" height="340" rx="16" fill="#f6fbf8" stroke="#cfe4da" stroke-width="1.5"/>
  
  <!-- Títulos -->
  <text x="195" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">Visão Lógica (Árvore Quase Completa)</text>
  <text x="575" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">Representação Implícita em Vetor (V)</text>
  <line x1="390" y1="24" x2="390" y2="316" stroke="#dce9e3" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Arestas da Árvore -->
  <g stroke="#789096" stroke-width="2.2">
    <line x1="195" y1="84" x2="115" y2="164"/>
    <line x1="195" y1="84" x2="275" y2="164"/>
    <line x1="115" y1="164" x2="70" y2="244"/>
    <line x1="115" y1="164" x2="160" y2="244"/>
    <line x1="275" y1="164" x2="230" y2="244"/>
  </g>

  <!-- Nós da Árvore -->
  <!-- Raiz [0] -->
  <circle cx="195" cy="84" r="24" fill="#147d78"/>
  <text x="195" y="89" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">90</text>
  <rect x="215" y="54" width="24" height="18" rx="5" fill="#173b43"/>
  <text x="227" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">[0]</text>

  <!-- Nível 1 [1] e [2] -->
  <circle cx="115" cy="164" r="23" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
  <text x="115" y="169" text-anchor="middle" font-size="15" font-weight="700" fill="#173b43">75</text>
  <rect x="70" y="135" width="24" height="18" rx="5" fill="#dff1eb"/>
  <text x="82" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0d625f">[1]</text>

  <circle cx="275" cy="164" r="23" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
  <text x="275" y="169" text-anchor="middle" font-size="15" font-weight="700" fill="#173b43">80</text>
  <rect x="296" y="135" width="24" height="18" rx="5" fill="#dff1eb"/>
  <text x="308" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0d625f">[2]</text>

  <!-- Nível 2 [3], [4], [5] -->
  <circle cx="70" cy="244" r="22" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
  <text x="70" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">40</text>
  <rect x="27" y="216" width="24" height="18" rx="5" fill="#dff1eb"/>
  <text x="39" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#0d625f">[3]</text>

  <circle cx="160" cy="244" r="22" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
  <text x="160" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">60</text>
  <rect x="176" y="216" width="24" height="18" rx="5" fill="#dff1eb"/>
  <text x="188" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#0d625f">[4]</text>

  <circle cx="230" cy="244" r="22" fill="#ffffff" stroke="#147d78" stroke-width="2.5"/>
  <text x="230" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#173b43">50</text>
  <rect x="247" y="216" width="24" height="18" rx="5" fill="#dff1eb"/>
  <text x="259" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#0d625f">[5]</text>

  <!-- Legenda Árvore -->
  <text x="195" y="305" text-anchor="middle" font-size="12" fill="#42636a">Todo pai é ≥ seus filhos (Raiz = Máximo)</text>

  <!-- Vetor Contíguo -->
  <g transform="translate(425, 130)">
    <!-- Célula 0 -->
    <text x="25" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#789096">0</text>
    <rect x="0" y="0" width="50" height="46" rx="8" fill="#147d78"/>
    <text x="25" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">90</text>

    <!-- Célula 1 -->
    <text x="77" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#789096">1</text>
    <rect x="52" y="0" width="50" height="46" rx="8" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
    <text x="77" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#173b43">75</text>

    <!-- Célula 2 -->
    <text x="129" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#789096">2</text>
    <rect x="104" y="0" width="50" height="46" rx="8" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
    <text x="129" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#173b43">80</text>

    <!-- Célula 3 -->
    <text x="181" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#789096">3</text>
    <rect x="156" y="0" width="50" height="46" rx="8" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
    <text x="181" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#173b43">40</text>

    <!-- Célula 4 -->
    <text x="233" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#789096">4</text>
    <rect x="208" y="0" width="50" height="46" rx="8" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
    <text x="233" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#173b43">60</text>

    <!-- Célula 5 -->
    <text x="285" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#789096">5</text>
    <rect x="260" y="0" width="50" height="46" rx="8" fill="#ffffff" stroke="#147d78" stroke-width="2"/>
    <text x="285" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#173b43">50</text>

    <!-- Arcos de Exemplo i=1 -->
    <path d="M 77 50 Q 129 88 181 50" fill="none" stroke="#147d78" stroke-width="1.8" stroke-dasharray="4,3"/>
    <path d="M 77 50 Q 155 106 233 50" fill="none" stroke="#a44338" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="155" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#173b43">Para i = 1 (75): Esq = 2(1)+1 = 3 | Dir = 2(1)+2 = 4</text>
  </g>
</svg>
